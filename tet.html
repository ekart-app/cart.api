<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samplicity Ecosystem — Interactive Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #07101f;
    --surface:  #0d1a2e;
    --panel:    #112036;
    --border:   #1a3050;
    --teal:     #0eb8cc;
    --teal-dim: #0d7c8a;
    --green:    #2ecc8f;
    --orange:   #f47c3b;
    --purple:   #9b6ddf;
    --amber:    #e8a838;
    --sky:      #38b2f4;
    --text:     #c8ddf0;
    --dim:      #4a6880;
    --glow-t:   rgba(14,184,204,0.35);
    --glow-g:   rgba(46,204,143,0.35);
    --glow-o:   rgba(244,124,59,0.35);
    --glow-p:   rgba(155,109,223,0.35);
    --glow-a:   rgba(232,168,56,0.35);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    overflow: hidden;
  }

  /* ── CANVAS ── */
  #canvas {
    width: 100%; height: 100%;
    position: relative;
    cursor: grab;
    user-select: none;
  }
  #canvas.dragging { cursor: grabbing; }

  svg#lines {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  /* ── NODES ── */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: filter 0.2s, transform 0.2s;
  }
  .node:hover { transform: translate(-50%, -50%) scale(1.06); }
  .node.collapsed .node-children-hint { opacity: 1; }

  .node-box {
    border-radius: 10px;
    border: 1.5px solid;
    padding: 10px 16px;
    text-align: center;
    position: relative;
    backdrop-filter: blur(6px);
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .node:hover .node-box {
    box-shadow: 0 0 28px var(--node-glow, rgba(14,184,204,0.4));
  }

  .node-code {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--node-color, var(--teal));
  }
  .node-label {
    font-size: 9px;
    color: var(--dim);
    margin-top: 2px;
    line-height: 1.4;
    max-width: 130px;
  }
  .node-portal {
    font-size: 8px;
    margin-top: 5px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid;
    color: var(--node-color, var(--teal));
    border-color: var(--node-color, var(--teal));
    opacity: 0.75;
  }

  /* expand/collapse indicator */
  .expand-badge {
    position: absolute;
    top: -9px; right: -9px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--node-color, var(--teal));
    color: #07101f;
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: transform 0.2s;
    font-family: 'Rajdhani', sans-serif;
  }
  .node.open .expand-badge { transform: rotate(45deg); }

  /* Root node special */
  .node-root .node-box {
    padding: 14px 22px;
    border-width: 2px;
  }
  .node-root .node-code { font-size: 20px; letter-spacing: 3px; }

  /* ── DETAIL PANEL ── */
  #detail {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 28px 24px;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(.4,0,.2,1);
    z-index: 100;
    overflow-y: auto;
  }
  #detail.open { transform: translateX(0); }

  .detail-close {
    position: absolute;
    top: 16px; right: 16px;
    background: none; border: 1px solid var(--border);
    color: var(--dim); cursor: pointer;
    width: 28px; height: 28px;
    border-radius: 5px;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .detail-close:hover { border-color: var(--teal); color: var(--teal); }

  .detail-badge {
    display: inline-block;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .detail-full {
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .detail-divider {
    height: 1px;
    background: var(--border);
    margin: 14px 0;
  }
  .detail-section-title {
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .detail-desc {
    font-size: 11px;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 14px;
  }
  .detail-portal {
    font-size: 10px;
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid;
    margin-bottom: 10px;
    display: inline-block;
  }
  .detail-tag {
    display: inline-block;
    font-size: 8.5px;
    padding: 3px 8px;
    border-radius: 3px;
    margin: 3px 3px 3px 0;
    border: 1px solid;
  }
  .tag-legacy { color: var(--orange); border-color: var(--orange); background: rgba(244,124,59,0.08); }
  .tag-latest { color: var(--green); border-color: var(--green); background: rgba(46,204,143,0.08); }
  .tag-tbd    { color: var(--dim);   border-color: var(--dim);   background: transparent; }
  .tag-active { color: var(--teal);  border-color: var(--teal);  background: rgba(14,184,204,0.08); }

  /* ── CONTROLS ── */
  #controls {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px;
    z-index: 50;
  }
  .ctrl-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    transition: border-color 0.2s, color 0.2s;
  }
  .ctrl-btn:hover { border-color: var(--teal); color: var(--teal); }

  /* ── BREADCRUMB ── */
  #breadcrumb {
    position: fixed;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 2px;
    z-index: 50;
    display: flex; align-items: center; gap: 6px;
  }
  .bc-sep { opacity: 0.4; }

  /* ── LEGEND ── */
  #legend {
    position: fixed;
    bottom: 72px; left: 24px;
    font-size: 9px;
    color: var(--dim);
    z-index: 50;
    line-height: 2;
  }
  .legend-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 200;
    max-width: 200px;
    line-height: 1.5;
  }

  /* ── TITLE ── */
  #title-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 14px 24px 0;
    display: flex; align-items: center; gap: 14px;
    z-index: 40;
    pointer-events: none;
  }
  #title-bar h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--teal);
  }
  #title-bar span {
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* hint text */
  #hint {
    position: fixed;
    bottom: 72px; right: 24px;
    font-size: 9px;
    color: var(--dim);
    text-align: right;
    line-height: 2;
    z-index: 50;
  }
</style>
</head>
